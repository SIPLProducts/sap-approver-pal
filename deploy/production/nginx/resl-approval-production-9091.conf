# ---------------------------------------------------------------------------
# RESL Approval — PRODUCTION server (10.150.150.130), single vhost on port 9091
#
# Install:
#   cp deploy/production/nginx/resl-approval-production-9091.conf \
#      /etc/nginx/conf.d/resl-approval-production-9091.conf
#   nginx -t && nginx -s reload
#
# Port map (Production):
#   9091 -> nginx (external)     8090 -> SSR app server (localhost)
#   8010 -> Kong HTTP            8453 -> Kong HTTPS
#   3010 -> SAP middleware       3100 -> Supabase Studio
#
# IMPORTANT — this is a SELF-HOSTED SSR build (build-info.json: selfhost-node).
# There is NO static index.html in dist/. The app server on 127.0.0.1:8090
# renders every page, so `location /` MUST proxy. A `try_files … /index.html`
# there serves a stale shell and 404s every hashed asset in the browser.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade_prod {
    default upgrade;
    ''      close;
}

upstream supabase_api_prod    { server 127.0.0.1:8010; keepalive 16; }
upstream supabase_studio_prod { server 127.0.0.1:3100; }
upstream middleware_api_prod  { server 127.0.0.1:3010; keepalive 16; }
upstream app_server_prod      { server 127.0.0.1:8090; keepalive 16; }

server {
    listen 9091;
    server_name 10.150.150.130;

    server_tokens off;
    client_max_body_size 50M;

    access_log /data/webapplication/resl_approval/Production/logs/access.log;
    error_log  /data/webapplication/resl_approval/Production/logs/error.log;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- app server: server functions (SAP login, releases, MIGO, e-mail, push)
    location /_serverFn/ {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- app server: API routes (public hooks, middleware config/log)
    location /api/ {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- Supabase API gateway (Kong on 8010)
    location /supabase/ {
        proxy_pass http://supabase_api_prod/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_prod;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- Supabase Studio (no login of its own -> basic auth)
    location /studio/ {
        auth_basic "RESL Production Studio";
        auth_basic_user_file /etc/nginx/.htpasswd-studio-prod;
        proxy_pass http://supabase_studio_prod/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_prod;
        proxy_read_timeout 300s;
    }

    # ---- SAP middleware (3010)
    location /mw/ {
        proxy_pass http://middleware_api_prod/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection keep-alive;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- hashed build assets -> app server (same verified dist/ as SSR)
    location /assets/ {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- service worker / manifest -> app server; never cache registration
    location = /sw.js {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.webmanifest {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    # ---- app routes -> SSR app server on 8090 (NOT a static index.html)
    location / {
        proxy_pass http://app_server_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
