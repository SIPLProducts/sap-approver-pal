# RESL Approval — PRODUCTION environment
# Run from /data/webapplication/resl_approval/Production
#
#   docker compose --env-file .env.app        -p resl_production_app up -d --build
#   docker compose --env-file .env.middleware -p resl_production_mw  up -d --build
#
# The Supabase stack lives in ./supabase with its own compose file (-p resl_production).

services:
  app:
    build:
      context: ./app/src
      dockerfile: deploy/Dockerfile.app
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: resl-app:production
    container_name: resl-app-production
    env_file:
      - .env.app
    environment:
      PORT: 3010
    ports:
      - "127.0.0.1:3010:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  middleware:
    build:
      context: ./app/src/middleware
      dockerfile: Dockerfile
    image: resl-middleware:production
    container_name: resl-middleware-production
    env_file:
      - .env.middleware
    ports:
      - "127.0.0.1:3006:3005"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
