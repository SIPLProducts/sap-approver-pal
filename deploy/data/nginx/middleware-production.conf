server {
    listen 80;
    server_name mw.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mw.example.com;

    ssl_certificate     /etc/letsencrypt/live/mw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mw.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    access_log /var/log/nginx/resl-prod-mw.access.log;
    error_log  /var/log/nginx/resl-prod-mw.error.log;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }
}
