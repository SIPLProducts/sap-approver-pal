server {
    listen 80;
    server_name quality.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name quality.example.com;

    ssl_certificate     /etc/letsencrypt/live/quality.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quality.example.com/privkey.pem;
    # For an internal CA / self-signed cert, replace the two lines above with:
    #   ssl_certificate     /etc/nginx/ssl/resl.crt;
    #   ssl_certificate_key /etc/nginx/ssl/resl.key;
    #   ...and delete the two lines below.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;
    access_log /var/log/nginx/resl-quality-app.access.log;
    error_log  /var/log/nginx/resl-quality-app.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long SAP-backed server functions can run for minutes.
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }
}
