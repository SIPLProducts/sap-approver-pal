# ---------------------------------------------------------------------------
# RESL Approval — QUALITY, IP-BASED, SINGLE HOST, PORT 8081
#
# Use this when the server is reached directly by IP address (no DNS name
# and no TLS certificate). All traffic enters through port 8081.
#
#   http://10.150.150.130:8081/          -> TanStack Start SSR app
#   http://10.150.150.130:8081/supabase/ -> Supabase API gateway (Kong) : 8000
#   http://10.150.150.130:8081/studio/   -> Supabase Studio              : 3000
#   http://10.150.150.130:8081/mw/       -> SAP middleware               : 3002
#
# Link: /etc/nginx/sites-available/resl-approval-quality-ip-8081
# ---------------------------------------------------------------------------

upstream resl_quality_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream resl_quality_kong {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream resl_quality_studio {
    server 127.0.0.1:3000;
}

upstream resl_quality_mw {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 10.150.150.130:8081;
    server_name 10.150.150.130;

    # ---- Security headers ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- Body limits: keep >= Supabase FILE_SIZE_LIMIT (50 MB) ----
    client_max_body_size    50m;
    client_body_timeout     300s;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/resl-quality-ip-8081.access.log;
    error_log  /var/log/nginx/resl-quality-ip-8081.error.log warn;

    proxy_intercept_errors off;

    # -----------------------------------------------------------------------
    # Supabase API gateway (Kong): /rest, /auth, /storage, /realtime, /functions
    # -----------------------------------------------------------------------
    location /supabase/ {
        proxy_pass http://resl_quality_kong/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Supabase Studio — gate it with HTTP basic auth.
    #   sudo htpasswd -c /etc/nginx/.htpasswd-studio studioadmin
    # -----------------------------------------------------------------------
    location /studio/ {
        auth_basic           "RESL Quality Studio";
        auth_basic_user_file /etc/nginx/.htpasswd-studio;

        proxy_pass http://resl_quality_studio/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # SAP middleware.
    # -----------------------------------------------------------------------
    location /mw/ {
        proxy_pass http://resl_quality_mw/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering         off;
        proxy_request_buffering off;

        # Optional hardening — restrict to corporate ranges:
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # ---- Content-hashed assets: cache forever ----
    location /assets/ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- PWA files must revalidate so updates land ----
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # -----------------------------------------------------------------------
    # App: SSR HTML and its own /api/* server functions.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }
}
