# ---------------------------------------------------------------------------
# SAP middleware — QUALITY. Upstream: PM2 "resl-quality-mw" 127.0.0.1:3005
# Every request must carry MIDDLEWARE_SHARED_SECRET; the app enforces that.
# Link: /etc/nginx/sites-available/resl-approval-quality-middleware
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name mw-quality.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mw-quality.example.com;

    ssl_certificate     /etc/letsencrypt/live/mw-quality.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mw-quality.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    client_max_body_size 25m;

    access_log /var/log/nginx/resl-quality-mw.access.log;
    error_log  /var/log/nginx/resl-quality-mw.error.log warn;

    # Optional hardening — restrict to corporate ranges:
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Must stay >= SAP_REQUEST_TIMEOUT_MS (300000) in backend/.env
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
