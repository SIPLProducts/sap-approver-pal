# ---------------------------------------------------------------------------
# RESL Approval — QUALITY app
# TanStack Start SSR: one process serves HTML AND the app's own /api/*.
# Upstream: PM2 "resl-quality-app" on 127.0.0.1:3000
# Link: /etc/nginx/sites-available/resl-approval-quality
# ---------------------------------------------------------------------------

upstream resl_quality_app {
    server 127.0.0.1:3000;
    keepalive 32;                       # reuse upstream TCP connections
}

server {
    listen 80;
    listen [::]:80;
    server_name quality.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quality.example.com;

    # ---- TLS: Let's Encrypt ----
    ssl_certificate     /etc/letsencrypt/live/quality.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quality.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # ---- TLS: internal CA — replace the four lines above with these ----
    # ssl_certificate     /data/webapplication/resl_approval/Quality/ssl/resl-quality.crt;
    # ssl_certificate_key /data/webapplication/resl_approval/Quality/ssl/resl-quality.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;             # Let's Encrypt only
    ssl_stapling_verify on;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- Body limits: keep >= Supabase FILE_SIZE_LIMIT (50 MB) ----
    client_max_body_size    50m;
    client_body_timeout     300s;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/resl-quality-app.access.log;
    error_log  /var/log/nginx/resl-quality-app.error.log warn;

    proxy_intercept_errors off;         # let the app render its own errors

    # ---- Content-hashed assets: cache forever ----
    location /assets/ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- PWA files must revalidate so updates land ----
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- App API (server functions): never cached, long SAP timeouts ----
    location /api/ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        add_header Cache-Control "no-store" always;
        proxy_no_cache          1;
        proxy_cache_bypass      1;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;      # >= SAP_REQUEST_TIMEOUT_MS
        send_timeout         300s;
    }

    # ---- SSR HTML. No try_files / SPA fallback: routing is server-rendered.
    location / {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }
}
