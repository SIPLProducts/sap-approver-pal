# Shared gzip settings. Link to /etc/nginx/conf.d/01-gzip.conf
gzip              on;
gzip_vary         on;        # correct caching per Accept-Encoding
gzip_comp_level   5;         # good ratio, low CPU
gzip_min_length   1024;      # tiny bodies grow when compressed
gzip_proxied      any;       # compress proxied upstream responses too
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;
# Images (png/jpg/webp) are already compressed and deliberately omitted.
