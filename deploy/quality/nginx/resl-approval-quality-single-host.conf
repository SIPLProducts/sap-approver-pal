# ---------------------------------------------------------------------------
# RESL Approval — QUALITY, SINGLE HOST, PATH-BASED
#
# One hostname serves everything. No extra DNS records, no extra certificates.
#
#   /            -> TanStack Start SSR app (also serves the app's own /api/*) : 8081
#   /supabase/   -> Supabase API gateway (Kong)                              : 8000
#   /studio/     -> Supabase Studio (basic-auth protected)                   : 3000
#   /mw/         -> SAP middleware                                           : 3002
#
# Port 8080 is intentionally unused: the app's /api/* server functions are
# served by the same SSR process on 8081, so no separate /api upstream exists.
#
# Because Supabase and the middleware now live on paths, the app env must use:
#   VITE_SUPABASE_URL   = https://<host>/supabase
#   middleware base URL = https://<host>/mw
#
# Requires the shared snippet 00-upgrade-map.conf (defines $connection_upgrade)
# linked into /etc/nginx/conf.d/.
# Link: /etc/nginx/sites-available/resl-approval-quality-single-host
# ---------------------------------------------------------------------------

upstream resl_quality_app {
    server 127.0.0.1:8081;
    keepalive 32;                       # reuse upstream TCP connections
}

upstream resl_quality_kong {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream resl_quality_studio {
    server 127.0.0.1:3000;
}

upstream resl_quality_mw {
    server 127.0.0.1:3002;
    keepalive 16;
}

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name quality.example.com;
    return 301 https://$host$request_uri;
}

# ---- Internal box with no TLS? Delete the two server blocks' TLS lines and
# ---- use this instead of the redirect above:
#   server {
#       listen 80;
#       server_name quality.example.com;
#       ... same location blocks as below ...
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quality.example.com;

    # ---- TLS: Let's Encrypt ----
    ssl_certificate     /etc/letsencrypt/live/quality.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quality.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # ---- TLS: internal CA — replace the four lines above with these ----
    # ssl_certificate     /data/webapplication/resl_approval/Quality/ssl/resl-quality.crt;
    # ssl_certificate_key /data/webapplication/resl_approval/Quality/ssl/resl-quality.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- Body limits: keep >= Supabase FILE_SIZE_LIMIT (50 MB) ----
    client_max_body_size    50m;
    client_body_timeout     300s;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/resl-quality.access.log;
    error_log  /var/log/nginx/resl-quality.error.log warn;

    proxy_intercept_errors off;         # let the app render its own errors

    # -----------------------------------------------------------------------
    # Supabase API gateway (Kong): /rest, /auth, /storage, /realtime, /functions
    # The /supabase prefix is stripped before it reaches Kong.
    # Same-origin as the app, so no CORS handling is needed here.
    # -----------------------------------------------------------------------
    location /supabase/ {
        proxy_pass http://resl_quality_kong/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;      # Realtime
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Supabase Studio — no login of its own, so gate it with HTTP basic auth.
    #   sudo htpasswd -c /etc/nginx/.htpasswd-studio studioadmin
    # -----------------------------------------------------------------------
    location /studio/ {
        auth_basic           "RESL Quality Studio";
        auth_basic_user_file /etc/nginx/.htpasswd-studio;

        proxy_pass http://resl_quality_studio/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # SAP middleware. Prefix stripped; every request must carry
    # MIDDLEWARE_SHARED_SECRET — the middleware itself enforces that.
    # Timeouts must stay >= SAP_REQUEST_TIMEOUT_MS (300000).
    # -----------------------------------------------------------------------
    location /mw/ {
        proxy_pass http://resl_quality_mw/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering         off;
        proxy_request_buffering off;

        # Optional hardening — restrict to corporate ranges:
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny  all;
    }

    # ---- Content-hashed assets: cache forever ----
    location /assets/ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- PWA files must revalidate so updates land ----
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # -----------------------------------------------------------------------
    # App: SSR HTML *and* its own /api/* server functions, same process.
    # No try_files / SPA fallback — routing is server-rendered.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://resl_quality_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;      # >= SAP_REQUEST_TIMEOUT_MS
        send_timeout         300s;
        proxy_buffering off;
    }
}
